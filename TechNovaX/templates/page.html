<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{title}} | TechNovaX</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#05060d">
<link rel="canonical" href="{{canonical}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<meta name="robots" content="{{robots}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/fa.min.css">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/post.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}document.documentElement.classList.add('js');</script>
</head>
<body class="post-body">
<div class="scroll-progress" id="scrollProgress"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<!--HEADER:START-->
<!--HEADER:END-->

<main class="post-page" id="main">
  <div class="post-bg" aria-hidden="true"><i></i><i></i></div>
  <div class="container narrow post-container">
{{content}}
  </div>
</main>

<!--FOOTER:START-->
<!--FOOTER:END-->

<script src="/assets/js/config.js"></script>
<script src="/assets/js/analytics.js" defer></script>
<script src="/assets/js/main.js" defer></script>
</body>
</html>
