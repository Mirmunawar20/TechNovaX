<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;background:#05060d;font-family:'Space Grotesk','Inter',system-ui,sans-serif;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
.b{position:absolute;border-radius:50%;filter:blur(110px)}.b1{width:520px;height:520px;left:-100px;top:-120px;background:#4a63ff;opacity:.7}.b2{width:480px;height:480px;right:-80px;top:80px;background:#a64bff;opacity:.55}.b3{width:420px;height:420px;left:40%;bottom:-200px;background:#ff4f9a;opacity:.4}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000,transparent)}
.logo{position:relative;display:flex;align-items:center;gap:20px;font-size:54px;font-weight:700;letter-spacing:-.02em;margin-bottom:34px}
.mark{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#6d8bff,#a06bff 50%,#ff5ca8);display:grid;place-items:center}
h1{position:relative;font-size:96px;line-height:1.02;letter-spacing:-.04em;font-weight:700}
.g{background:linear-gradient(120deg,#6d8bff,#a06bff 50%,#ff5ca8);-webkit-background-clip:text;color:transparent}
p{position:relative;margin-top:28px;font-size:32px;color:#aab3d6}
</style></head><body><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="grid"></div>
<div class="logo"><div class="mark"><svg viewBox="0 0 32 32" width="50" height="50"><path d="M18.5 2 6 18h8l-2 12L26 13h-8z" fill="#fff"/></svg></div>TechNova<span class="g">X</span></div>
<h1>Technology made<br><span class="g">simple.</span></h1>
<p>Networking · CCTV · Dev · Hardware · Mobile · AI</p></body></html>
